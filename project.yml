name: Henge
options:
  bundleIdPrefix: io.river
  developmentLanguage: en
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  groupSortPosition: top
  generateEmptyDirectories: true
configs:
  Debug: debug
  Release: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # river.io llc — the team the distribution certificate belongs to.
    DEVELOPMENT_TEAM: U3Z59VXPUB
    # Warnings are the only signal that something compiled but is wrong
    # (factory/dark-factory.md §3). Keep the build warning-clean rather than
    # silencing this.
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO

# The shared engine, linked from this same directory as a local path package.
# Both apps get the identical HengeAstro/Geometry/Engine/UI build products, so
# way for the platforms to drift apart in logic.
packages:
  HengeLocal:
    path: .

targets:
  # ── iOS (iPhone + iPad) ────────────────────────────────────────────────
  Henge:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
      - path: iOSApp
    dependencies:
      - package: HengeLocal
        product: HengeAstro
      - package: HengeLocal
        product: HengeGeometry
      - package: HengeLocal
        product: HengeEngine
      - package: HengeLocal
        product: HengeStore
      - package: HengeLocal
        product: HengeUI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.river.henge
        INFOPLIST_FILE: iOSApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES

  # ── iOS UI tests ───────────────────────────────────────────────────────
  # Pixel-level inspection. The package tests cannot see how a window
  # *composites* — the rebuild card once drew upside down in landscape
  # while the accessibility tree swore it was fine — so this bundle drives
  # the real app in the simulator and reads the screen back through OCR.
  # Run with `make uitest`; it is minutes rather than seconds, which is why
  # it is not part of `make test`.
  HengeUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: UITests
    dependencies:
      - target: Henge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.river.henge.uitests
        TEST_TARGET_NAME: Henge
        GENERATE_INFOPLIST_FILE: YES

  # ── macOS ──────────────────────────────────────────────────────────────
  # Same bundle id as iOS on purpose: one App Store Connect record covering
  # both platforms, the way MeowPassword ships.
  Henge-macOS:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
      - path: macOSApp
    dependencies:
      - package: HengeLocal
        product: HengeAstro
      - package: HengeLocal
        product: HengeGeometry
      - package: HengeLocal
        product: HengeEngine
      - package: HengeLocal
        product: HengeStore
      - package: HengeLocal
        product: HengeUI
    settings:
      base:
        PRODUCT_NAME: Henge
        PRODUCT_BUNDLE_IDENTIFIER: io.river.henge
        INFOPLIST_FILE: macOSApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        ENABLE_PREVIEWS: YES
        ENABLE_HARDENED_RUNTIME: YES

schemes:
  Henge:
    build:
      targets:
        Henge: all
        HengeUITests: test
    run:
      config: Debug
      # The local storefront. Without it StoreKit has no product to sell in
      # the simulator, the paywall shows its fallback price and no purchase
      # can be rehearsed — the flow would first run for real in review.
      storeKitConfiguration: Henge.storekit
    test:
      config: Debug
      targets:
        - HengeUITests
  Henge-macOS:
    build:
      targets:
        Henge-macOS: all
    run:
      config: Debug
